[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mylib"
version = "0.1.0"
authors = [
  { name = "Your Name", email = "xxx@example.com" }
]
description = "Demo lib with 5 subpackages for acceptance"
requires-python = ">=3.10"
dependencies = [
  # 这里放你的运行时依赖，空着就写 []
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "build",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
